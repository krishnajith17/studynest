<!doctype html>
<html lang="en" data-theme="dark" data-palette="aurora">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c18" />
    <meta name="description" content="StudyNest Chroma - Vivid Academic Syllabus & Engineering Study Hub. High-contrast vibrant themes, instant notes, accredited textbooks, and interactive study tools." />
    <title>StudyNest Chroma | Vivid Engineering Curriculum & Study Incubator</title>
    
    <!-- Instant Dark Background to Prevent White Flash -->
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        background-color: #080c18 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #080c18;
      }
      #root:empty::after {
        content: "Loading StudyNest Chroma...";
        color: #00f0ff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        animation: pulseLoad 1.5s ease-in-out infinite;
      }
      @keyframes pulseLoad {
        0%, 100% { opacity: 0.5; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
