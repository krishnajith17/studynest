<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="chromaGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="48" height="48" rx="14" fill="#090d1a"/>
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="url(#chromaGrad)" stroke-width="2" stroke-opacity="0.8"/>
  
  <!-- Glowing Chroma Nest arc -->
  <path d="M10 27C10 34.732 16.268 41 24 41C31.732 41 38 34.732 38 27" stroke="url(#chromaGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M14 30C16.5 35 20 37 24 37C28 37 31.5 35 34 30" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Academic Cap / Prism -->
  <path d="M24 9L38 16.5L24 24L10 16.5L24 9Z" fill="url(#chromaGrad)"/>
  <path d="M15 20.5V27C15 29.5 19 31.5 24 31.5C29 31.5 33 29.5 33 27V20.5" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Radiant jewel tassel -->
  <circle cx="38" cy="18" r="2" fill="#ffdd00" filter="url(#glow)"/>
  <path d="M38 19.5V26" stroke="#ffdd00" stroke-width="1.8" stroke-linecap="round"/>
</svg>
